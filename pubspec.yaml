name: homeease
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # State Management
  provider: ^6.1.2
  flutter_bloc: ^8.1.6

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0

  # Location & Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0

  # Firebase Core (required for all Firebase services)
  firebase_core: ^3.15.2

  # Firebase Auth
  firebase_auth: ^5.7.0

  # Firestore Database 🔥
  cloud_firestore: ^5.4.3

  # Notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Image & File Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # AI & ML
  tflite_flutter: ^0.12.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # UI Components
  flutter_svg: ^2.0.15
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Charts & Analytics
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

# App icon configuration (dependencies ke bahar)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.jpeg"

# Native splash screen configuration
flutter_native_splash:
  color: "#2E7D32"
  image: "assets/icons/icon.jpeg"
  android: true
  ios: true
  android_12:
    image: "assets/icons/icon.jpeg"
    color: "#2E7D32"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
